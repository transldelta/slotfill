<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" role="img" aria-label="SlotFill Logo">
  <defs>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="grad-check" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2563eb" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect x="8" y="8" width="104" height="104" rx="24" ry="24" fill="url(#grad-primary)" filter="url(#shadow)"/>

  <!-- Calendar body -->
  <rect x="22" y="34" width="76" height="60" rx="8" ry="8" fill="white" fill-opacity="0.18"/>
  <rect x="22" y="34" width="76" height="60" rx="8" ry="8" stroke="white" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- Calendar header bar -->
  <rect x="22" y="34" width="76" height="18" rx="8" ry="8" fill="white" fill-opacity="0.22"/>
  <rect x="22" y="46" width="76" height="6" fill="white" fill-opacity="0.22"/>

  <!-- Calendar hooks -->
  <rect x="38" y="26" width="6" height="14" rx="3" fill="white" fill-opacity="0.85"/>
  <rect x="76" y="26" width="6" height="14" rx="3" fill="white" fill-opacity="0.85"/>

  <!-- Calendar grid dots (available slots) -->
  <rect x="30" y="62" width="8" height="8" rx="2" fill="white" fill-opacity="0.35"/>
  <rect x="46" y="62" width="8" height="8" rx="2" fill="white" fill-opacity="0.35"/>
  <rect x="62" y="62" width="8" height="8" rx="2" fill="white" fill-opacity="0.35"/>

  <rect x="30" y="76" width="8" height="8" rx="2" fill="white" fill-opacity="0.35"/>
  <rect x="46" y="76" width="8" height="8" rx="2" fill="white" fill-opacity="0.35"/>

  <!-- Filled slot (highlighted teal) -->
  <rect x="62" y="76" width="26" height="8" rx="2" fill="white" fill-opacity="0.85"/>

  <!-- Checkmark inside filled slot -->
  <polyline points="65,80 69,84 84,76" stroke="url(#grad-primary)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
